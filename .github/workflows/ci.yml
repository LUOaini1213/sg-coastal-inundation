name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install "numpy>=1.24" "scipy>=1.10" "pandas>=2.0" "pytest>=7" "h5py>=3.8" affine
      - name: Unit and output-consistency tests
        run: python -m pytest -q
      - name: README numbers recomputed from committed outputs
        run: python tools/check_readme_numbers.py
      - name: Mutation check (every planted bug must fail a test)
        run: python tools/mutation_check.py
